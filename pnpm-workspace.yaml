packages:
  - apps/*
  - packages/*

overrides:
  deepmerge-ts: 8.0.2
  mysql2: 3.24.4

allowBuilds:
  "@prisma/engines": true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
